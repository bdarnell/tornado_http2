name: Test

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      tornado_dep:
        description: >-
          Tornado requirement to test against, for example
          "tornado @ git+https://github.com/tornadoweb/tornado.git@master".
          Leave empty to use the version pinned in maint/requirements.txt.
        required: false
        default: ""

env:
  PYTHON_VERSION: "3.15"
  # Passed through the environment rather than interpolated into scripts.
  TORNADO_DEP_INPUT: ${{ inputs.tornado_dep }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        client: [native, curl]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install tox
        run: python -m pip install -r maint/requirements.txt
      - name: Select Tornado version
        run: |
          if [ -n "$TORNADO_DEP_INPUT" ]; then
            echo "TORNADO_DEP=$TORNADO_DEP_INPUT" >> "$GITHUB_ENV"
          else
            echo "TORNADO_DEP=$(grep -E '^tornado==' maint/requirements.txt)" >> "$GITHUB_ENV"
          fi
      - name: Run tests
        run: |
          py=py$(echo "$PYTHON_VERSION" | tr -d .)
          envs="$py-${{ matrix.client }}-http2"
          # Tornado's own test suite only passes over HTTP/2 with changes
          # that are not yet in a release (expected in Tornado 6.7), so run
          # it only when testing against an explicitly chosen Tornado
          # (normally master). Run it unconditionally once 6.7 is pinned.
          if [ -n "$TORNADO_DEP_INPUT" ]; then
            envs="$envs,$py-${{ matrix.client }}-tornado"
          fi
          echo "Testing with $TORNADO_DEP"
          tox -e "$envs"

  h2spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install tox
        run: python -m pip install -r maint/requirements.txt
      - name: Select Tornado version
        run: |
          if [ -n "$TORNADO_DEP_INPUT" ]; then
            echo "TORNADO_DEP=$TORNADO_DEP_INPUT" >> "$GITHUB_ENV"
          else
            echo "TORNADO_DEP=$(grep -E '^tornado==' maint/requirements.txt)" >> "$GITHUB_ENV"
          fi
      - name: Install h2spec
        run: |
          mkdir -p "$RUNNER_TEMP/h2spec"
          curl -sSfL https://github.com/summerwind/h2spec/releases/download/v2.6.0/h2spec_linux_amd64.tar.gz \
            | tar xz -C "$RUNNER_TEMP/h2spec"
          echo "H2SPEC=$RUNNER_TEMP/h2spec/h2spec" >> "$GITHUB_ENV"
      - name: Run h2spec
        run: |
          py=py$(echo "$PYTHON_VERSION" | tr -d .)
          echo "Testing with $TORNADO_DEP"
          tox -e "$py-h2spec"
